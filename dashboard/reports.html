<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes TalentFlow</title>
    <style>
        :root {
            --primary: #8E44AD;
            --secondary: #2C3E50;
            --accent: #E67E22;
            --bg: #121212;
            --card-bg: #1E1E1E;
            --text: #F0F0F0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 98%;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background: #333;
            color: var(--accent);
        }

        tr:hover {
            background: #252525;
        }

        .status-applied {
            color: #2ecc71;
            font-weight: bold;
        }

        .status-failed {
            color: #e74c3c;
            font-weight: bold;
        }

        .status-pending {
            color: #f1c40f;
        }

        .status-discarded {
            color: #e74c3c;
            /* Red for discarded */
            opacity: 0.8;
            font-style: italic;
        }

        .status-matched {
            color: #2ecc71;
            /* Green for matched */
            font-weight: bold;
            text-shadow: 0 0 5px rgba(46, 204, 113, 0.3);
        }

        .status-processing {
            color: var(--accent);
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .filter-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input,
        select,
        button {
            padding: 10px;
            background: #252525;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }

        button {
            cursor: pointer;
        }

        /* Console styling for logs */
        .log-console {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: #d1d1d1;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.5;
            margin-top: 10px;
        }

        .log-line {
            border-bottom: 1px solid #222;
            padding: 4px 0;
        }

        .log-timestamp {
            color: #8E44AD;
            margin-right: 10px;
        }

        .bulk-actions {
            margin-bottom: 15px;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .pagination-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            border: 1px solid #333;
        }

        .page-info {
            font-weight: bold;
            color: var(--accent);
        }

        .pagination-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .pagination-btn:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .selected-row {
            background: rgba(142, 68, 173, 0.15) !important;
            border-left: 3px solid var(--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="btn-back">⬅ Volver al Dashboard</a>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
            <h1>📊 Reporte de Ofertas</h1>
            <div id="perfIndicator"
                style="background:#2C3E50; border: 1px solid #444; padding:8px 15px; border-radius:20px; font-size:0.9em; display:flex; align-items:center; gap:12px;">
                <div style="display:flex; align-items:center; gap:5px;">
                    <span style="color:#f1c40f;">⚡ Carga:</span>
                    <span id="procTimeValue" style="font-weight:bold; color:white;">0.0</span>
                    <span style="color:#888; font-size:0.8em;">seg/min</span>
                </div>
                <div style="width:1px; height:15px; background:#444;"></div>
                <div style="display:flex; align-items:center; gap:5px;">
                    <span style="color:#3498db;">📦 Ritmo:</span>
                    <span id="offersRateValue" style="font-weight:bold; color:white;">0.0</span>
                    <span style="color:#888; font-size:0.8em;">ofertas/min</span>
                </div>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Buscar empresa o rol..." onkeyup="filterTable()">
            <select id="statusFilter" onchange="filterTable()">
                <option value="all">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Matched">Matched</option>
                <option value="Applied">Applied</option>
                <option value="Failed">Failed</option>
                <option value="Discarded">Discarded</option>
            </select>
            <select id="modeFilter" onchange="filterTable()">
                <option value="all">All Modes</option>
                <option value="Remote">Remote</option>
                <option value="Hybrid">Hybrid</option>
                <option value="On-site">On-site</option>
                <option value="Unknown">Unknown</option>
            </select>
            <select id="typeFilter" onchange="filterTable()">
                <option value="all">All Types</option>
                <option value="Easy Apply">Easy Apply</option>
                <option value="External">External</option>
            </select>
            <select id="langFilter" onchange="filterTable()">
                <option value="all">Languages</option>
                <option value="Spanish">Spanish</option>
                <option value="English">English</option>
            </select>
            <button onclick="loadJobs()" style="background:var(--primary); border:none;">🔄
                Actualizar</button>
            <button onclick="clearReport()" style="background:#c0392b; border:none; margin-left:auto;">🗑️
                Eliminar Reporte</button>
        </div>

        <div class="bulk-actions" id="bulkActions">
            <span><strong>Bulk Action:</strong> Mover <span id="selectedCount">0</span> seleccionados a</span>
            <select id="bulkStatusSelect">
                <option value="Discarded">Discarded</option>
                <option value="Pending">Pending</option>
                <option value="Matched">Matched</option>
            </select>
            <button onclick="applyBulkUpdate()" style="background:#27ae60; border:none; font-weight:bold;">Aplicar
                Cambios</button>
        </div>

        <div class="pagination-bar" id="topPagination">
            <button onclick="changePage(-1)" class="pagination-btn" id="prevBtn">⬅ Anterior</button>
            <span class="page-info">Página <span id="currentPage">1</span> de <span id="totalPages">1</span> (<span
                    id="totalResults">0</span> ofertas)</span>
            <button onclick="changePage(1)" class="pagination-btn" id="nextBtn">Siguiente ➡</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 30px;"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()">
                    </th>
                    <th style="width: 40px;">ID</th>
                    <th>MATCH</th>
                    <th>COMPANY</th>
                    <th>ROLE</th>
                    <th>LOCATION</th>
                    <th>SKILLS</th>
                    <th>MODE</th>
                    <th>TYPE</th>
                    <th>LANG</th>
                    <th>DATE</th>
                    <th>RESUME</th>
                    <th>STATUS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="jobsTable">
                <tr>
                    <td colspan="13">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Requirements Modal -->
    <div id="reqModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
        <div
            style="background:#1E1E1E; padding:40px; border-radius:10px; width:70%; max-width:900px; max-height:85vh; overflow-y:auto; border: 2px solid #E67E22; position:relative; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
            <button onclick="closeModal()"
                style="position:absolute; top:15px; right:20px; background:none; border:none; color:white; font-size:2em; cursor:pointer;">&times;</button>
            <h2 id="modalTitle" style="color:#8E44AD; margin-top:0; margin-bottom: 5px;">Job Details</h2>
            <div id="modalMeta"
                style="color:#aaa; font-size: 0.95em; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;">
            </div>
            <div id="modalContent"
                style="font-family: 'Segoe UI', sans-serif; line-height: 1.8; font-size: 1.1em; color: #ddd;"></div>
        </div>
    </div>

    <script>
        window.onerror = function (msg, url, line, col, error) {
            alert("⚠️ SYSTEM ERROR: " + msg + "\nLine: " + line);
            document.getElementById('jobsTable').innerHTML = '<tr><td colspan="14" style="color:red">System Error: ' + msg + ' (Line ' + line + ')</td></tr>';
            return false;
        };

        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 100;
        let currentPageJobs = [];
        let selectedJobs = new Set();

        console.log("Script loaded. Calling loadJobs...");

        function renderTable(jobs) {
            const tbody = document.getElementById('jobsTable');
            if (jobs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="14">No jobs found.</td></tr>';
                return;
            }

            // Sync select all checkbox
            const selectAllCheck = document.getElementById('selectAllCheckbox');
            selectAllCheck.checked = (jobs.length > 0) && jobs.every(j => selectedJobs.has(j.id));

            updateBulkActionsUI();

            tbody.innerHTML = jobs.map((job, index) => {
                // External Link Logic
                let statusHtml = `<div><span class="status-${(job.status || 'Pending').toLowerCase().split(' ')[0]}">${job.status || 'Pending'}</span></div>`;
                if (job.ai_model) {
                    statusHtml += `<div style="font-size:0.75em; color:#888; margin-top:2px;">🤖 ${job.ai_model}</div>`;
                }
                if (job.external_link) {
                    statusHtml += ` <a href="${job.external_link}" target="_blank" title="Open External Application" style="text-decoration:none; font-size:1.2em;">🔗</a>`;
                }

                // AI Reason Extraction
                let displayRequirements = job.requirements || '-';
                if (job.raw_analysis) {
                    try {
                        const analysis = JSON.parse(job.raw_analysis);
                        if (analysis.reason) {
                            displayRequirements = `🤖 ${analysis.reason}`;
                        }
                    } catch (e) { }
                }

                const isChecked = selectedJobs.has(job.id) ? 'checked' : '';

                return `
                <tr style="cursor:pointer;" title="Click anywhere on the row to view details. Use checkbox to select." class="${isChecked ? 'selected-row' : ''}">
                    <td onclick="event.stopPropagation()">
                        <input type="checkbox" class="job-checkbox" value="${job.id}" ${isChecked} onchange="toggleJobSelection(${job.id}, this.checked)">
                    </td>
                    <td onclick="showDetails(${index})" style="font-family:monospace; color:var(--accent);">${job.id}</td>
                    <td onclick="showDetails(${index})" style="font-weight:bold; color:${job.match_score >= 80 ? '#2ecc71' : job.match_score >= 50 ? '#f1c40f' : '#e74c3c'}">${job.match_score || 0}%</td>
                    <td onclick="showDetails(${index})">${job.company || '-'}</td>
                    <td>${job.url ? `<a href="${job.url}" target="_blank" onclick="event.stopPropagation()" style="color:#3498db; text-decoration:none;">${job.role || 'Unknown'}</a>` : (job.role || 'Unknown')}</td>
                    <td onclick="showDetails(${index})">${job.location || '-'}</td>
                    <td onclick="showDetails(${index})" style="font-size:0.85em; color:#ddd;">${job.skills || '-'}</td>
                    <td onclick="showDetails(${index})"><span style="font-size:0.85em; background:#333; padding:2px 6px; border-radius:4px;">${job.work_mode || '-'}</span></td>
                    <td onclick="showDetails(${index})">${job.apply_type === 'Easy Apply' ? '<span title="Easy Apply" style="color:#2ecc71; font-weight:bold;">⚡ Easy</span>' : (job.apply_type === 'External' ? '<span title="External" style="color:#3498db; font-weight:bold;">🌍 Ext.</span>' : '-')}</td>
                    <td onclick="showDetails(${index})" style="font-size:0.85em; font-weight:bold; color:#f1c40f;">${job.language || '-'}</td>
                    <td onclick="showDetails(${index})">${job.date_posted || job.date || '-'}</td>
                    <td onclick="showDetails(${index})" style="font-size:0.8em; line-height:1.4;">
                        <div title="CV Planeado" style="color:#aaa;">📂 ${job.applied_resume ? job.applied_resume.split('/').pop() : '-'}</div>
                        ${job.uploaded_cv ? `<div title="CV Realmente subido" style="color:#2ecc71; margin-top:4px;">✅ ${job.uploaded_cv.split('/').pop()}</div>` : ''}
                    </td>
                    <td onclick="showDetails(${index})">${statusHtml}</td>
                    <td onclick="event.stopPropagation()">
                        <button onclick="reanalyzeJob(${job.id}, event)" id="re-btn-${job.id}" title="Re-evaluate with AI" style="background:#8E44AD; color:white; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; font-size:1.1em;">
                            🔄
                        </button>
                    </td>
                </tr>
            `}).join('');
        }

        function toggleJobSelection(jobId, isChecked) {
            if (isChecked) {
                selectedJobs.add(jobId);
            } else {
                selectedJobs.delete(jobId);
                document.getElementById('selectAllCheckbox').checked = false; // Uncheck select all if one item is unchecked
            }
            updateBulkActionsUI();
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAllCheckbox').checked;

            // Only toggle currently visible jobs on this page
            currentPageJobs.forEach(job => {
                if (isChecked) {
                    selectedJobs.add(job.id);
                } else {
                    selectedJobs.delete(job.id);
                }
            });

            // Re-render current page
            renderTable(currentPageJobs);
        }

        function updateBulkActionsUI() {
            const bulkBar = document.getElementById('bulkActions');
            const countSpan = document.getElementById('selectedCount');

            countSpan.innerText = selectedJobs.size;
            if (selectedJobs.size > 0) {
                bulkBar.style.display = 'flex';
            } else {
                bulkBar.style.display = 'none';
            }
        }

        async function applyBulkUpdate() {
            if (selectedJobs.size === 0) return;

            const newStatus = document.getElementById('bulkStatusSelect').value;

            if (!confirm(`¿Actualizar el estado de ${selectedJobs.size} oferta(s) a '${newStatus}'?`)) {
                return;
            }

            try {
                const res = await fetch('/api/jobs/bulk_update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        job_ids: Array.from(selectedJobs),
                        new_status: newStatus
                    })
                });

                if (!res.ok) throw new Error("Bulk update failed");
                const data = await res.json();

                // Clear selection on success and reload
                selectedJobs.clear();
                document.getElementById('selectAllCheckbox').checked = false;
                loadJobs(currentPage);

            } catch (e) {
                alert("❌ Error: " + e.message);
            }
        }

        async function loadJobs(page = 1) {
            try {
                currentPage = page;
                const title = document.querySelector('h1');
                const originalTitle = "📊 Reporte de Ofertas";
                title.innerText = originalTitle + " (Actualizando...)";

                const q = document.getElementById('searchInput').value;
                const status = document.getElementById('statusFilter').value;
                const mode = document.getElementById('modeFilter').value;
                const applyType = document.getElementById('typeFilter').value;
                const lang = document.getElementById('langFilter').value;

                let url = `/api/jobs?page=${page}&page_size=${pageSize}`;
                if (q) url += `&q=${encodeURIComponent(q)}`;
                if (status !== 'all') url += `&status=${status}`;
                if (mode !== 'all') url += `&mode=${mode}`;
                if (applyType !== 'all') url += `&apply_type=${applyType}`;
                if (lang !== 'all') url += `&lang=${lang}`;

                const res = await fetch(url);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();

                currentPageJobs = data.jobs;
                totalPages = data.total_pages;
                const totalResults = data.total;

                // Sync UI
                document.getElementById('currentPage').innerText = currentPage;
                document.getElementById('totalPages').innerText = totalPages;
                document.getElementById('totalResults').innerText = totalResults;
                document.getElementById('prevBtn').disabled = currentPage <= 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;

                renderTable(currentPageJobs);

                title.innerText = originalTitle;
            } catch (e) {
                console.error("Load error:", e);
            }
        }

        function changePage(delta) {
            const next = currentPage + delta;
            if (next >= 1 && next <= totalPages) {
                loadJobs(next);
            }
        }

        function filterTable() {
            // Server-side filtering: we reload from page 1
            loadJobs(1);
        }

        function showDetails(index) {
            const job = currentPageJobs[index];
            if (!job) return;

            document.getElementById('modalTitle').innerText = job.role;

            let aiContent = "";
            if (job.raw_analysis) {
                try {
                    const analysis = JSON.parse(job.raw_analysis);
                    const verdictColor = analysis.verdict === 'APPLY' ? '#27AE60' : analysis.verdict === 'REJECT' ? '#E74C3C' : '#F1C40F';

                    aiContent = `
                        <div style="background:#252525; border:1px solid #444; border-radius:8px; padding:15px; margin-bottom:20px;">
                            <h3 style="color:var(--primary); margin-top:0;">🤖 AI Analysis</h3>
                            <div style="display:flex; gap:15px; margin-bottom:15px;">
                                <div style="flex:1; background:#1a1a1a; padding:10px; border-radius:5px; border-left:4px solid ${verdictColor};">
                                    <div style="font-size:0.8em; color:#888; text-transform:uppercase;">Verdict</div>
                                    <div style="font-size:1.2em; font-weight:bold; color:${verdictColor};">${analysis.verdict || 'UNKNOWN'}</div>
                                </div>
                                <div style="flex:1; background:#1a1a1a; padding:10px; border-radius:5px; border-left:4px solid var(--accent);">
                                    <div style="font-size:0.8em; color:#888; text-transform:uppercase;">Level Detected</div>
                                    <div style="font-size:1.2em; font-weight:bold; color:white;">${analysis.seniority_level_detected || '-'}</div>
                                </div>
                            </div>
                            
                            <div style="margin-bottom:15px;">
                                <strong style="color:var(--accent);">Reasoning:</strong>
                                <p style="margin:5px 0; color:#ddd; font-style:italic;">"${analysis.reasoning || analysis.reason || '-'}"</p>
                            </div>

                            <div style="margin-bottom:15px; background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px dashed #444;">
                                <strong style="color:#f1c40f;">Justification:</strong>
                                <p style="margin:5px 0; color:#ccc; font-size: 0.9em;">${analysis.score_breakdown?.justification || '-'}</p>
                            </div>

                            <div style="font-size:0.9em;">
                                <strong style="color:#aaa;">Scoring Breakdown:</strong>
                                <ul style="list-style:none; padding-left:10px; margin:5px 0;">
                                    <li>🔹 <strong style="color:#888;">Tier 1 (Role):</strong> ${analysis.scoring_audit?.tier1_alignment?.score || 0} pts - <span style="color:#666;">${analysis.scoring_audit?.tier1_alignment?.evidence || ''}</span></li>
                                    <li>🔹 <strong style="color:#888;">Tier 2 (Stack):</strong> ${analysis.scoring_audit?.tier2_core_stack?.score || 0} pts - <span style="color:#666;">${analysis.scoring_audit?.tier2_core_stack?.evidence || ''}</span></li>
                                    <li>🔹 <strong style="color:#888;">Tier 3 (Cloud):</strong> ${analysis.scoring_audit?.tier3_infra?.score || 0} pts - <span style="color:#666;">${analysis.scoring_audit?.tier3_infra?.evidence || ''}</span></li>
                                </ul>
                            </div>
                        </div>
                    `;
                } catch (e) {
                    console.error("Error parsing analysis:", e);
                }
            }

            document.getElementById('modalMeta').innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <strong style="color:white; font-size:1.15em;">${job.company}</strong> 
                        &nbsp;•&nbsp; ${job.location} 
                        &nbsp;•&nbsp; <span style="color:#E67E22;">🗓️ Publicado: ${job.date_posted || job.date || 'No Date'}</span>
                        <div style="margin-top:10px;">
                            ${job.work_mode && job.work_mode !== 'Unknown' ? `<span style="background:#333; padding:2px 8px; border-radius:4px; font-size:0.8em; border:1px solid #444;">${job.work_mode}</span> &nbsp;` : ''}
                            ${job.apply_type === 'Easy Apply' ? `<span style="background:#2ecc71; color:black; padding:2px 8px; border-radius:4px; font-size:0.8em; font-weight:bold;">⚡ Easy Apply</span> &nbsp;` : (job.apply_type === 'External' ? `<span style="background:#3498db; color:white; padding:2px 8px; border-radius:4px; font-size:0.8em; font-weight:bold;">🌍 External</span> &nbsp;` : '')}
                            <span style="color:#aaa; font-size:0.9em;">Source: ${job.source}</span>
                            <div style="color:#777; font-size:0.75em; margin-top:5px;">🔍 Escaneado por el bot: ${job.updated_at || job.created_at || 'Unknown'}</div>
                            ${job.ai_model ? `<div style="color:#8E44AD; font-size:0.8em; margin-top:5px; font-weight:bold;">🤖 Procesado por: ${job.ai_model}</div>` : ''}
                        </div>
                    </div>
                    <div style="text-align:right; background:rgba(142, 68, 173, 0.1); padding:10px; border-radius:8px; border:1px solid var(--primary);">
                        <div style="font-size:0.8em; color:#8E44AD; text-transform:uppercase;">Overall Match</div>
                        <div style="font-size:1.8em; font-weight:bold; color:var(--primary);">${job.match_score || 0}%</div>
                    </div>
                </div>
                <br>
                <div style="background:#2C3E50; padding:10px; border-radius:5px; border-left:4px solid #3498db; margin-bottom:20px;">
                    <strong style="color:#3498db;">📄 Resume Planned:</strong> <span style="color:#fff;">${job.applied_resume || 'None recorded'}</span>
                    ${job.uploaded_cv ? `<br><strong style="color:#2ecc71;">✅ Actual Uploaded:</strong> <span style="color:#fff;">${job.uploaded_cv}</span>` : ''}
                </div>
                ${aiContent}
                
                ${job.error_log ? `
                    <div style="margin-top:25px;">
                        <h3 style="color:#e74c3c; border-bottom:1px solid #444; padding-bottom:10px; margin-bottom:10px;">🛡️ Traza de Aplicación (Logs)</h3>
                        <div class="log-console">
                            ${job.error_log.trim().split('\n').map(line => {
                const match = line.match(/^\[(.*?)\] (.*)/);
                if (match) {
                    return `<div class="log-line"><span class="log-timestamp">[${match[1]}]</span> ${match[2]}</div>`;
                }
                return `<div class="log-line">${line}</div>`;
            }).join('')}
                        </div>
                    </div>
                ` : ''}
            `;

            const rawText = job.raw_requirements || job.requirements || "No requirements text available.";
            document.getElementById('modalContent').innerHTML = `
                <h3 style="color:#E67E22; border-bottom:1px solid #333; padding-bottom:10px;">Full Requirements</h3>
                ${formatRequirements(rawText)}
            `;

            document.getElementById('reqModal').style.display = 'flex';
        }

        function formatRequirements(text) {
            if (!text) return "";
            // 1. Safety Escape
            let safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            // 2. Highlighting Headers (Before break conversion)
            // We look for typical headers and give them a strong visual style
            safe = safe.replace(/((?:Responsibilities|Requirements|Qualifications|What you will do|Nice to have|Skills|About the role).*?:)/gi,
                '<div style="color:var(--primary); font-size:1.15em; font-weight:bold; margin-top:20px; margin-bottom:10px; border-bottom:1px solid #333; display:inline-block;">$1</div>');

            // 3. Bullet points: Try to detect them and make them nice
            safe = safe.replace(/([✓✅•-])\s+/g, '<br><span style="color:var(--accent);">•</span> ');

            // 4. Newlines: controlled spacing
            // Single newlines become a space (join wrapped lines), Double newlines become a paragraph break
            // But this is risky if the text is truly unstructured. Let's try preserving format but reducing gap.
            safe = safe.replace(/\n\s*\n/g, '<div style="height:12px;"></div>'); // Paragraph gap
            safe = safe.replace(/\n/g, '<br>'); // Single break

            // 5. Cleanup start/end
            safe = safe.trim();

            return `<div style="font-size:0.95em; color:#ddd; text-align:justify;">${safe}</div>`;
        }

        function closeModal() {
            document.getElementById('reqModal').style.display = 'none';
        }

        // Close on outside click (Safe)
        const modal = document.getElementById('reqModal');
        if (modal) {
            modal.onclick = function (e) {
                if (e.target === this) closeModal();
            }
        } else {
            console.error("Critical: reqModal element not found in DOM.");
        }



        async function reanalyzeJob(jobId, event) {
            if (event) event.stopPropagation();

            const btn = document.getElementById(`re-btn-${jobId}`);
            const originalHtml = btn.innerHTML;

            if (btn.disabled) return;

            try {
                btn.disabled = true;
                btn.innerHTML = '...';
                btn.style.opacity = '0.5';

                const res = await fetch(`/api/jobs/${jobId}/reanalyze`, { method: 'POST' });
                if (!res.ok) throw new Error("Analysis failed");
                const data = await res.json();

                // Success animation
                btn.innerHTML = '✅';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }, 2000);

                loadJobs(currentPage); // Refresh table preserving current page
            } catch (e) {
                alert("❌ Error: " + e.message);
                btn.innerHTML = '❌';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }, 3000);
            }
        }

        async function clearReport() {
            if (!confirm("⚠️ ¿Estás seguro/a?\n\nEsto borrará PERMANENTEMENTE:\n1. Todas las ofertas de la base de datos.\n2. El historial de actividad.\n3. Los logs de auditoría.\n\nEl sistema quedará como nuevo.")) {
                return;
            }

            try {
                const res = await fetch('/api/clear_jobs', { method: 'POST' });
                if (!res.ok) throw new Error("Server Error");

                alert("✅ Sistema reseteado correctamente.");
                selectedJobs.clear();
                document.getElementById('selectAllCheckbox').checked = false;
                updateBulkActionsUI();
                loadJobs(); // Refresh table (empty)
            } catch (e) {
                alert("❌ Error al limpiar: " + e.message);
            }
        }

        // Initial load
        loadJobs();

        let lastStatus = null;
        let lastTotalJobs = null;
        let lastUpdateTime = 0;

        // SSE Initialization for Real-Time Report Sync
        function initSSE() {
            const evtSource = new EventSource("/events");

            evtSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    const currentStatus = (data.status && data.status.status ? data.status.status : '').toLowerCase();
                    const currentTotal = data.stats ? data.stats.total_jobs : 0;
                    const currentUpdateTime = (data.status && data.status.last_updated) ? data.status.last_updated : Date.now();

                    // Refresh if total jobs count changed, or status changed
                    const countChanged = lastTotalJobs !== null && currentTotal !== lastTotalJobs;
                    const statusChanged = lastStatus !== null && currentStatus !== lastStatus;

                    if (countChanged || statusChanged || lastTotalJobs === null) {
                        loadJobs(currentPage);
                        console.log(`[Real-Time Sync] Actualizando reporte: Total=${currentTotal}, Status=${currentStatus}`);
                        lastTotalJobs = currentTotal;
                        lastStatus = currentStatus;
                        lastUpdateTime = currentUpdateTime;
                    }

                    // Update Title State
                    const title = document.querySelector('h1');
                    if (title) {
                        if (currentStatus.includes('running')) {
                            if (!title.innerText.includes('⚙️')) {
                                title.innerHTML = `📊 Reporte de Ofertas <span style="font-size:0.6em; color:var(--accent); animation: pulse 1.5s infinite;">⚙️ Evaluando con Gemini (${currentTotal} guardadas)...</span>`;
                            }
                        } else {
                            title.innerHTML = `📊 Reporte de Ofertas <span style="font-size:0.6em; color:#2ecc71;">(${currentTotal} Ofertas)</span>`;
                        }
                    }
                } catch (e) {
                    console.error("SSE parse error:", e);
                }
            };

            evtSource.onerror = (err) => {
                console.error("SSE Connection Failed, reconectando...", err);
                evtSource.close();
                setTimeout(initSSE, 3000);
            };
        }

        // Auto-refresh interval (cada 3 segundos durante la búsqueda)
        setInterval(() => {
            if (lastStatus && lastStatus.includes('running')) {
                loadJobs(currentPage);
            }
        }, 3000);

        initSSE();
    </script>
